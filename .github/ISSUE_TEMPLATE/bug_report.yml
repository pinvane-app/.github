name: Problem report / 문제 알리기
description: Something in Pinvane does not work as expected. / Pinvane이 예상대로 동작하지 않을 때.
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please never attach drawings, project files, customer names or file paths.** We do not need them. If a problem must be shown, make a small sample project with a few parts that shows the same thing.
        **도면 · 프로젝트 파일 · 고객 이름 · 파일 경로는 절대 올리지 마세요.** 문제를 보여 줘야 하면 부품 몇 개만 넣은 작은 견본 프로젝트로 같은 일이 일어나게 해 주세요.

        Security problem? Do not use this form — see [SECURITY.md](https://github.com/pinvane-app/.github/blob/main/SECURITY.md). / 보안 문제는 이 양식을 쓰지 말고 SECURITY.md 를 보세요.
  - type: input
    id: version
    attributes:
      label: Pinvane version / Pinvane 판
      description: "Command / 명령: `pinvane version`"
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 판
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen? / 어디서 일어났나요?
      options:
        - Editor (screen) / 편집기(화면)
        - AI app through MCP / MCP 로 연결한 AI 앱
        - AI window (own key) / AI 창(내 키)
        - Command line / 명령줄
        - Export or printed output / 내보내기 · 출력물
        - Install, license or update / 설치 · 사용권 · 업데이트
        - Other / 그 밖
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect? / 무슨 일이 있었고, 무엇을 기대했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 재현 순서
      description: With a small sample project if possible. / 가능하면 작은 견본 프로젝트로.
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: report
    attributes:
      label: Problem report (optional) / 문제 보고서(선택)
      description: "Paste the report from `pinvane report-bug` after reading it. Remove anything you do not want to share. / `pinvane report-bug` 보고서를 읽어 본 뒤 붙여 넣으세요. 보이고 싶지 않은 줄은 지우세요."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send / 보내기 전에
      options:
        - label: "I attached no drawings, project files, customer names, file paths, keys or passwords. / 도면 · 프로젝트 파일 · 고객 이름 · 파일 경로 · 키 · 비밀번호를 넣지 않았습니다."
          required: true
