name: Question / 질문
description: How do I …? Questions about using Pinvane. / 사용법 질문.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [user guide](https://github.com/pinvane-app/pinvane#readme) may already answer it. / [사용 방법](https://github.com/pinvane-app/pinvane/blob/main/README.ko.md)에 답이 있을 수 있습니다.
        **Please never attach drawings, project files, customer names or file paths.** / **도면 · 프로젝트 파일 · 고객 이름 · 파일 경로는 절대 올리지 마세요.**
        License or payment questions: support@pinvane.com. / 사용권 · 결제는 support@pinvane.com 으로.
  - type: textarea
    id: question
    attributes:
      label: Your question / 질문
      description: What are you trying to do, and what have you tried? / 무엇을 하려고 하고, 무엇을 해 보았나요?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pinvane version (if installed) / Pinvane 판(설치했다면)
      placeholder: "1.0.0"
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send / 보내기 전에
      options:
        - label: "I attached no drawings, project files, customer names, file paths, keys or passwords. / 도면 · 프로젝트 파일 · 고객 이름 · 파일 경로 · 키 · 비밀번호를 넣지 않았습니다."
          required: true
